name: Terraform CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"
  TF_ROOT: "terraform/environments"

jobs:
  # ------------------------------------------------------------
  # 1. SECURITY
  # ------------------------------------------------------------
  validate-and-scan:
    name: Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt (check)
        working-directory: ${{ env.TF_ROOT }}/dev
        run: terraform fmt -check -recursive

      - name: Terraform init (light)
        working-directory: ${{ env.TF_ROOT }}/dev
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TF_ROOT }}/dev
        run: terraform validate

      - name: Install Checkov
        run: python -m pip install --upgrade pip && pip install checkov

      - name: Checkov scan (Terraform)
        run: checkov -d terraform --quiet

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          path: terraform
          hide-progress: true
          severity: CRITICAL,HIGH
          exit-code: 1

  # ------------------------------------------------------------
  # 2. DEV
  # ------------------------------------------------------------
  plan-dev:
    needs: validate-and-scan
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      environment: dev
      action: plan
      aws_role_arn: ${{ vars.AWS_DEV_ROLE_ARN }}
      aws_region: ${{ vars.AWS_DEV_REGION }}

  apply-dev:
    needs: plan-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      environment: dev
      action: apply
      aws_role_arn: ${{ vars.AWS_DEV_ROLE_ARN }}
      aws_region: ${{ vars.AWS_DEV_REGION }}

  # ------------------------------------------------------------
  # 3. PROD
  # ------------------------------------------------------------
  plan-prod:
    needs: apply-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      environment: prod
      action: plan
      aws_role_arn: ${{ vars.AWS_PROD_ROLE_ARN }}
      aws_region: ${{ vars.AWS_PROD_REGION }}

  apply-prod:
    needs: plan-prod
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      environment: prod
      action: apply
      aws_role_arn: ${{ vars.AWS_PROD_ROLE_ARN }}
      aws_region: ${{ vars.AWS_PROD_REGION }}