name: Reusable Terraform

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      action:
        required: true
        type: string
      aws_role_arn:
        required: true
        type: string
      aws_region:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Terraform init
        working-directory: terraform/environments/${{ inputs.environment }}
        run: terraform init -input=false

      - name: Terraform validate
        if: ${{ inputs.action == 'plan' || inputs.action == 'apply' }}
        working-directory: terraform/environments/${{ inputs.environment }}
        run: terraform validate

      - name: Terraform plan
        if: ${{ inputs.action == 'plan' }}
        working-directory: terraform/environments/${{ inputs.environment }}
        run: |
          terraform plan -var-file="terraform.tfvars" -out=tfplan
          terraform show -no-color tfplan > terraform-plan.txt

      - name: Upload plan artifact
        if: ${{ inputs.action == 'plan' }}
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: |
            terraform/environments/${{ inputs.environment }}/tfplan
            terraform/environments/${{ inputs.environment }}/terraform-plan.txt

      - name: Download plan artifact
        if: ${{ inputs.action == 'apply' }}
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: terraform/environments/${{ inputs.environment }}

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: terraform/environments/${{ inputs.environment }}
        run: terraform apply -auto-approve tfplan
